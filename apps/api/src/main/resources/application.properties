spring.application.name=repair-api
# 8080 is deliberately avoided: it is commonly already bound locally (e.g.
# by an unrelated RabbitMQ management UI container) on this machine.
server.port=${API_PORT:8082}

# Local Docker Compose Postgres+pgvector instance (see docker-compose.yml).
# Host port 5544 is deliberately non-default so it never collides with the
# owner's existing local PostgreSQL instance or the original repair_db.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5544}/${DB_NAME:repair_v2}
spring.datasource.username=${DB_USER:repair_v2}
spring.datasource.password=${DB_PASSWORD:repair_v2_local_only}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# OpenAI configuration. The key is read only from the server-side
# environment (never NEXT_PUBLIC_*, never committed) — see .env.example.
# Missing key is a valid runtime state: catalogue endpoints still work,
# chat endpoints return a clear "AI not configured" response instead of a
# generic 500.
repair.openai.api-key=${OPENAI_API_KEY:}
repair.openai.generation-model=${OPENAI_GENERATION_MODEL:gpt-4.1-mini}
repair.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
repair.openai.embedding-dimensions=${OPENAI_EMBEDDING_DIMENSIONS:1536}
repair.openai.request-timeout-seconds=${OPENAI_REQUEST_TIMEOUT_SECONDS:30}
repair.openai.max-retries=${OPENAI_MAX_RETRIES:2}

# Bounded conversation/generation limits (see docs/planning for rationale).
repair.chat.max-history-messages=${CHAT_MAX_HISTORY_MESSAGES:20}
repair.chat.max-message-length=${CHAT_MAX_MESSAGE_LENGTH:2000}
repair.chat.max-retrieved-chunks=${CHAT_MAX_RETRIEVED_CHUNKS:6}
repair.chat.max-output-tokens=${CHAT_MAX_OUTPUT_TOKENS:900}
# Hard cap on total evidence size sent to the model, independent of chunk
# count — six large chunks could still be an expensive prompt even under
# max-retrieved-chunks, so this is a second, direct bound on spend.
repair.chat.max-evidence-words=${CHAT_MAX_EVIDENCE_WORDS:1200}

# The one vehicle with curated knowledge-corpus scenario coverage, resolved
# by real catalogue criteria (never a hardcoded id) — see DemoVehicleProperties.
repair.demo.manufacturer-name=${DEMO_MANUFACTURER_NAME:BMW}
repair.demo.model-name=${DEMO_MODEL_NAME:BMW 3 Series Sedan}
repair.demo.variant-name-contains=${DEMO_VARIANT_NAME_CONTAINS:(E90) 320d 6MT RWD (177 HP)}
repair.demo.year-start=${DEMO_YEAR_START:2008}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
