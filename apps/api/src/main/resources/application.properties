spring.application.name=repair-api
# 8080 is deliberately avoided: it is commonly already bound locally (e.g.
# by an unrelated RabbitMQ management UI container) on this machine.
server.port=${API_PORT:8082}

# Local Docker Compose Postgres+pgvector instance (see docker-compose.yml).
# Host port 5544 is deliberately non-default so it never collides with the
# owner's existing local PostgreSQL instance or the original repair_db.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5544}/${DB_NAME:repair_v2}
spring.datasource.username=${DB_USER:repair_v2}
spring.datasource.password=${DB_PASSWORD:repair_v2_local_only}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# OpenAI configuration. The key is read only from the server-side
# environment (never NEXT_PUBLIC_*, never committed) — see .env.example.
# Missing key is a valid runtime state: catalogue endpoints still work,
# chat endpoints return a clear "AI not configured" response instead of a
# generic 500.
repair.openai.api-key=${OPENAI_API_KEY:}
repair.openai.generation-model=${OPENAI_GENERATION_MODEL:gpt-4.1-mini}
repair.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
repair.openai.embedding-dimensions=${OPENAI_EMBEDDING_DIMENSIONS:1536}
repair.openai.request-timeout-seconds=${OPENAI_REQUEST_TIMEOUT_SECONDS:30}
repair.openai.max-retries=${OPENAI_MAX_RETRIES:2}

# Bounded conversation/generation limits (see docs/planning for rationale).
repair.chat.max-history-messages=${CHAT_MAX_HISTORY_MESSAGES:20}
repair.chat.max-message-length=${CHAT_MAX_MESSAGE_LENGTH:2000}
repair.chat.max-retrieved-chunks=${CHAT_MAX_RETRIEVED_CHUNKS:6}
repair.chat.max-output-tokens=${CHAT_MAX_OUTPUT_TOKENS:900}
# Hard cap on total evidence size sent to the model, independent of chunk
# count — six large chunks could still be an expensive prompt even under
# max-retrieved-chunks, so this is a second, direct bound on spend.
repair.chat.max-evidence-words=${CHAT_MAX_EVIDENCE_WORDS:1200}

# The one vehicle with curated knowledge-corpus scenario coverage, resolved
# by real catalogue criteria (never a hardcoded id) — see DemoVehicleProperties.
repair.demo.manufacturer-name=${DEMO_MANUFACTURER_NAME:BMW}
repair.demo.model-name=${DEMO_MODEL_NAME:BMW 3 Series Sedan}
repair.demo.variant-name-contains=${DEMO_VARIANT_NAME_CONTAINS:(E90) 320d 6MT RWD (177 HP)}
repair.demo.year-start=${DEMO_YEAR_START:2008}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Google OAuth2/OIDC login (only auth provider — see docs/authentication.md).
# Client id/secret are read only from the server-side environment, never
# committed. Spring Boot's OAuth2 client autoconfiguration refuses to
# start at all with a genuinely empty client id/secret, so the fallback
# here is a non-empty placeholder rather than "" — the API still starts
# fully (catalogue/car/motorcycle-catalog endpoints all work, and so do
# the tests) without real credentials configured; only actually completing
# a Google sign-in requires the real values, and Google itself will
# reject the placeholder with an ordinary OAuth error rather than the API
# crashing.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
# {baseUrl} resolves to this server's own origin at request time (e.g.
# http://localhost:8082 in local dev) — the exact callback URL to register
# in Google Cloud Console is {baseUrl}/api/login/oauth2/code/google, see
# docs/authentication.md.
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/login/oauth2/code/google

# The frontend's own origin. Google's OAuth callback lands the browser
# directly on THIS backend's own port, bypassing the Next.js dev proxy
# entirely (see docs/authentication.md "Why the post-login redirect must
# be absolute") — OAuth2LoginSuccessHandler always redirects to this
# configured origin, never a bare relative path, so a real login never
# ends up on this backend's own 404 page. Override in a real deployment
# where the frontend has a different origin.
repair.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# Session cookie: HttpOnly by default; SameSite=Lax so the cookie survives
# the top-level GET redirect back from Google's own login page. `secure`
# is left for the hosting environment to set true behind HTTPS in a real
# deployment (would break plain http://localhost in local dev if forced
# here) — see docs/authentication.md.
server.servlet.session.cookie.same-site=lax
